name: Build APK from ZIP

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack project ZIP
        id: unpack
        run: |
          set -eu
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -n "$ZIP" ]; then
            echo "Распаковываю: $ZIP"
            rm -rf _unpacked
            mkdir _unpacked
            unzip -q -o "$ZIP" -d _unpacked
            SEARCH="_unpacked"
          else
            echo "ZIP не найден, ищу проект среди файлов репозитория"
            SEARCH="."
          fi
          SETTINGS=$(find "$SEARCH" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Не найден settings.gradle(.kts). Проверьте, что в ZIP лежит Android-проект."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Проект найден в: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже установлен на runner'е ubuntu-latest (ANDROID_HOME).
      # Принимаем лицензии и ставим платформу/build-tools напрямую через sdkmanager.
      - name: Prepare Android SDK
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect and verify APK
        run: |
          set -eu
          mkdir -p apk_out
          find "${{ steps.unpack.outputs.project_dir }}" -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk_out/ \;
          if [ -z "$(ls -A apk_out)" ]; then
            echo "::error::APK не найден после сборки"
            exit 1
          fi
          ls -lh apk_out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCutUltimate-debug-apk
          path: apk_out/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk_out/*.apk
